[pytest]
markers =
    integration: marks tests as integration tests (requiring Supabase local)
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    -W ignore::DeprecationWarning
filterwarnings =
    ignore::DeprecationWarning
